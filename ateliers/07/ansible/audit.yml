---
- name: Vérifier la configuration réellement déployée
  hosts: all
  gather_facts: false
  vars_files:
    - variables.yml
  tasks:
    # Fourni : l'audit doit aussi détecter un programme absent.
    - name: Lire les métadonnées des programmes
      ansible.builtin.stat:
        path: "{{ dossier_deploiement }}/{{ item }}"
      loop:
        - controle_disque.py
        - support.py
      register: programmes
    - name: Vérifier présence et permissions des programmes
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
          - (item.stat.mode | default('absent')) == '0600'
        fail_msg: "Programme absent ou permissions incorrectes : relancer le déploiement."
      loop: "{{ programmes.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Lire les métadonnées du fichier INI
      ansible.builtin.stat:
        path: "{{ dossier_deploiement }}/supervision.ini"
      register: configuration
    - name: Vérifier existence et permissions
      ansible.builtin.assert:
        that:
          - configuration.stat.exists
          # TODO 10 : remplacer '0000' par le mode demandé dans le déploiement.
          - configuration.stat.mode == '0000'
        fail_msg: "Relire le fichier et ses permissions avant de poursuivre."
    - name: Lire le contenu du fichier INI
      ansible.builtin.slurp:
        src: "{{ dossier_deploiement }}/supervision.ini"
      register: contenu
    - name: Vérifier les valeurs déployées
      ansible.builtin.assert:
        that:
          # TODO 11 : remplacer false par le contrôle du seuil expliqué dans le README.
          - false
          - >-
            ('intervalle_s=' ~ (intervalle_s | string))
            in (contenu.content | b64decode).splitlines()
        fail_msg: "Le fichier présent ne correspond pas aux variables attendues."
        success_msg: "Contenu et permissions conformes."
