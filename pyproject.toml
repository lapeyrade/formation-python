[project]
name = "python-administration"
version = "1.0.0"
description = "Apprendre Python par six projets d’administration système"
requires-python = ">=3.13,<3.14"
dependencies = ["pandas>=3.0,<4", "openpyxl>=3.1,<4", "requests>=2.34,<3", "scrapy>=2.19,<3", "fabric>=3.2,<4", "aiosmtpd>=1.4.6,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_tools", "ateliers/03/ma_boite"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17", "ty==0.0.84", "rumdl==0.2.78"]
distant = ["ansible-core>=2.20,<2.21; sys_platform != 'win32'"]

[tool.uv]
default-groups = ["dev", "distant"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["admin_tools", "ma_boite", "parc", "solution"]

[tool.ty.environment]
extra-paths = ["src", "ateliers/03"]

[tool.rumdl.MD033]
# Ancres stables et indices dépliables pris en charge par GitHub.
allowed-elements = ["a", "details", "summary"]

[tool.rumdl.MD013]
line-length = 120
code-blocks = false
tables = false
reflow = true
